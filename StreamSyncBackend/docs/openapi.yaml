    PatchedCommentUpdateRequest:
      type: object
      description: |-
        Update input.

        Two distinct operations share this endpoint because the frontend PATCHes
        both: `body` is an edit (author only) and `resolved` is a workflow action
        (any editor, or the thread's author). The view applies the right rule to
        whichever field is present.
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        resolved:
          type: boolean
    PatchedDocumentUpdateRequest:
      type: object
      description: |-
        Partial update.

        `workspace_id` is absent by design: moving a document between workspaces
        would carry it across a tenant boundary.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
        project_id:
          type: string
          format: uuid
          nullable: true
        revision:
          type: integer
          minimum: 1
        summary:
          type: string
          default: ''
          maxLength: 200
    PatchedNotificationUpdateRequest:
      type: object
      description: |-
        Update input.

        Only the read flag is writable — everything else was composed by the server
        when the event happened. A client that could edit `title` could rewrite its
        own history of what it was told.
      properties:
        read:
          type: boolean
    PatchedProjectUpdateRequest:
      type: object
      description: Partial update. Every field optional; workspace and owner are not
        here.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 2000
        status:
          $ref: '#/components/schemas/ProjectStatus'
        due_date:
          type: string
          format: date
          nullable: true
    PatchedTaskUpdateRequest:
      type: object
      description: |-
        Partial update.

        Every field optional — the board patches `status` alone on every drag, and
        sending only what changed means two people editing different fields of the
        same task do not overwrite each other.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
    PatchedUpdateMemberRoleRequest:
      type: object
      description: Role change input. Owner is excluded — ownership is transferred.
      properties:
        role:
          $ref: '#/components/schemas/AssignableWorkspaceRole'
    PatchedWorkspaceUpdateRequest:
      type: object
      description: |-
        Partial update input.

        `slug` is absent by design: it is assigned once and never changes, so that
        existing links keep working after a rename.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 500
    PendingInvitation:
      type: object
      description: |-
        An invitation from the invitee's side.

        Distinct from `WorkspaceMemberSerializer`, which describes somebody *within*
        a workspace you are already looking at and therefore has no reason to name
        it. Here the workspace is the whole point: the recipient is deciding whether
        to join, and "you have been invited as an editor" without saying by whom, or
        to what, is not a decision anyone can make.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        workspace_name:
          type: string
          readOnly: true
        workspace_slug:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/WorkspaceRole'
          readOnly: true
        invited_by:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        invited_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - invited_at
      - invited_by
      - role
      - workspace_id
      - workspace_name
      - workspace_slug
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: URL-safe identifier, unique within the workspace.
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ProjectStatus'
          readOnly: true
        task_count:
          type: integer
          description: |-
            Annotated by the view's queryset, so this costs no query per project.

            The fallback keeps the serializer usable outside that queryset — a
            correctness path, not the expected one.
          readOnly: true
        completed_task_count:
          type: integer
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        members:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Who can work on this project.

            There is no project-level membership: access to a project *is* access
            to its workspace (README §7), so the members are the workspace's active
            members. The view prefetches them, so this costs no query per row.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_task_count
      - created_at
      - description
      - due_date
      - id
      - members
      - name
      - slug
      - status
      - task_count
      - updated_at
      - workspace_id
    ProjectCreateRequest:
      type: object
      description: |-
        Creation input.

        `workspace_id` is in the body because the frontend posts to a flat
        `/api/projects/` rather than a nested route. It is validated against the
        caller's own workspaces in the view — the id itself is never trusted.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          default: ''
          maxLength: 2000
        status:
          allOf:
          - $ref: '#/components/schemas/ProjectStatus'
          default: planning
        due_date:
          type: string
          format: date
          nullable: true
        workspace_id:
          type: string
          format: uuid
      required:
      - name
      - workspace_id
    ProjectStatus:
      enum:
      - planning
      - active
      - on_hold
      - completed
      - archived
      type: string
      description: |-
        * `planning` - Planning
        * `active` - Active
        * `on_hold` - On hold
        * `completed` - Completed
        * `archived` - Archived
    RegisterRequest:
      type: object
      description: |-
        Registration input.

        A plain Serializer rather than a ModelSerializer: a ModelSerializer would
        expose every writable model field by default, so `is_staff` would be one
        forgotten line away from being settable by an anonymous request.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - name
      - password
    Rewrite:
      type: object
      description: |-
        Who produced this, and when.

        On every AI response. `engine` is the real identifier of whatever ran —
        a model id, or `mock-heuristic` when the deterministic fallback answered —
        because a UI that says "generated by AI" over rule-based string handling is
        a UI that has misled its user.
      properties:
        engine:
          type: string
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        text:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        changed:
          type: boolean
          readOnly: true
      required:
      - changed
      - engine
      - generated_at
      - note
      - text
    RewriteRequestRequest:
      type: object
      description: |-
        Input for `POST /api/ai/improve/`.

        `text` is plain text, never HTML — the frontend is explicit about this and
        so is the prompt. What comes back is inserted into a document, and a round
        trip that can carry markup is a round trip that can carry markup somebody
        else wrote.
      properties:
        document_id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 8000
        mode:
          $ref: '#/components/schemas/AiRewriteMode'
        tone:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AiTone'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - document_id
      - mode
      - text
    SearchResult:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/SearchResultTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        subtitle:
          type: string
          readOnly: true
          nullable: true
        href:
          type: string
          readOnly: true
          nullable: true
        score:
          type: number
          format: double
          readOnly: true
      required:
      - href
      - id
      - score
      - subtitle
      - title
      - type
    SearchResultTypeEnum:
      enum:
      - document
      - project
      - task
      - person
      type: string
      description: |-
        * `document` - document
        * `project` - project
        * `task` - task
        * `person` - person
    Session:
      type: object
      description: |-
        What every successful authentication returns.

        The refresh token is deliberately absent: it travels only as an httpOnly
        cookie. Putting it in the body would hand it to any script on the page and
        defeat the reason for the cookie. (README §25)
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        access:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - access
      - expires_at
      - user
    Summary:
      type: object
      description: |-
        Who produced this, and when.

        On every AI response. `engine` is the real identifier of whatever ran —
        a model id, or `mock-heuristic` when the deterministic fallback answered —
        because a UI that says "generated by AI" over rule-based string handling is
        a UI that has misled its user.
      properties:
        engine:
          type: string
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        summary:
          type: string
          readOnly: true
        key_points:
          type: array
          items:
            type: string
          readOnly: true
        decisions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - decisions
      - engine
      - generated_at
      - key_points
      - summary
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
          readOnly: true
        project_name:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TaskStatus'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/TaskPriority'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        labels:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Always empty for now.

            Labels are a workspace-level catalogue with their own endpoint in the
            frontend, and they are not part of README §10 or Milestone 5. The field
            is present so the client renders an empty label row rather than
            crashing on a missing key. See SETUP.md.
          readOnly: true
        comment_count:
          type: integer
          description: Annotated by the view; the fallback keeps the serializer reusable.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - comment_count
      - created_at
      - description
      - due_date
      - id
      - labels
      - priority
      - project_id
      - project_name
      - status
      - title
      - updated_at
      - workspace_id
    TaskCreateRequest:
      type: object
      description: |-
        Creation input.

        `creator` comes from the session. `workspace_id`, `project_id` and
        `assignee_id` are all validated against the caller's own access in the view
        and the service — none of them is trusted as given.
      properties:
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          default: ''
          maxLength: 5000
        status:
          allOf:
          - $ref: '#/components/schemas/TaskStatus'
          default: todo
        priority:
          allOf:
          - $ref: '#/components/schemas/TaskPriority'
          default: medium
        assignee_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
      required:
      - project_id
      - title
      - workspace_id
    TaskPriority:
      enum:
      - low
      - medium
      - high
      - urgent
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
        * `urgent` - Urgent
    TaskStatus:
      enum:
      - todo
      - in_progress
      - review
      - done
      type: string
      description: |-
        * `todo` - Todo
        * `in_progress` - In Progress
        * `review` - Review
        * `done` - Done
    User:
      type: object
      description: |-
        The public shape of a user.

        Explicit `fields` rather than `exclude`: a field added to the model must
        never appear in an API response merely because someone forgot to hide it.
        That is how password hashes and internal flags leak.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Full name
          description: Display name shown to collaborators.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Used to sign in. Case-insensitively unique.
        avatar_url:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - created_at
      - email
      - id
      - name
      - title
    Workspace:
      type: object
      description: |-
        A workspace as seen *by the requesting user*.

        `role` is not a property of the workspace — it is a property of the
        relationship between this workspace and whoever is asking. It is included
        here because every screen that renders a workspace also needs to know which
        actions to offer, and a second request per workspace to find that out would
        be wasteful.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: URL-safe identifier. Assigned at creation and never changes.
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        role:
          type: string
          nullable: true
          description: |-
            Read the annotation the view's queryset attached.

            Falls back to a lookup only when the serializer is used outside that
            queryset, so the list endpoint stays at one query rather than one per
            workspace.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - member_count
      - name
      - role
      - slug
    WorkspaceCreateRequest:
      type: object
      description: |-
        Creation input.

        A plain Serializer rather than a ModelSerializer so that `owner` and `slug`
        are simply not accepted from the client. Both are decided by the service —
        a caller who could set `owner` could create a workspace belonging to
        somebody else.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          default: ''
          maxLength: 500
      required:
      - name
    WorkspaceMember:
      type: object
      description: One row in the members list — active members and pending invitations.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/WorkspaceRole'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MembershipStatus'
          readOnly: true
        joined_at:
          description: |-
            Never null, so the client can always render a date.

            An invited person has not joined yet, so the date shown is when they
            were invited. `status` is what distinguishes the two, and the UI reads
            that rather than inferring from the timestamp.
          readOnly: true
      required:
      - id
      - joined_at
      - role
      - status
      - user
    WorkspaceRole:
      enum:
      - owner
      - editor
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `editor` - Editor
        * `viewer` - Viewer
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
