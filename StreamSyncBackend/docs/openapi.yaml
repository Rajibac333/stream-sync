  /api/comments/:
    get:
      operationId: comments_list
      description: |-
        Returns thread roots with their replies nested, oldest first.

        Deliberately a bare array rather than the paginated envelope: the client renders a whole thread at once, and a comment panel that paged would hide half a conversation. A thread is bounded by the resource it hangs off. See SETUP.md for the README §48 deviation.
      summary: List threads on a resource
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
        required: true
      - in: query
        name: resource_type
        schema:
          type: string
          enum:
          - document
          - task
        required: true
