openapi: 3.0.3
info:
  title: StreamSync API
  version: 1.0.0
  description: Real-time collaborative workspace backend. Workspaces, projects, documents,
    tasks, activity and AI assistance.
paths:
  /api/health/:
    get:
      operationId: health
      description: Returns 200 whenever the process can serve requests. Checks no
        external dependency — use the readiness probe for that.
      summary: Liveness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Healthy:
                  value:
                    status: ok
                    service: streamsync-backend
                    version: 1.0.0
                    environment: local
                    time: '2026-08-03T10:15:00+00:00'
          description: ''
  /api/health/ready/:
    get:
      operationId: health_ready
      description: Verifies every backing service this instance needs. Returns 200
        when all checks pass and 503 when any of them fails.
      summary: Readiness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register
      description: Creates an account and signs the new user in. Passwords are checked
        against Django's configured validators; failures come back as field errors
        on `password`.
      summary: Create an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                Session:
                  value:
                    user:
                      id: 6f1b7c58-6d3a-4a5e-9e5e-9c0b1f2a3d4e
                      name: Raj Kumar
                      email: raj@streamsync.app
                      avatar_url: null
                      title: null
                      created_at: '2026-08-03T10:15:00Z'
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_at: '2026-08-03T10:30:00Z'
          description: Authenticated. The refresh token is set as an httpOnly cookie
            and is deliberately absent from this body.
        '400':
          description: Validation error, e.g. email already registered.
        '429':
          description: Too many registration attempts.
  /api/auth/login/:
    post:
      operationId: auth_login
      description: Exchanges email and password for a token pair. Wrong credentials
        and unknown accounts return an identical 401, so this endpoint cannot be used
        to discover which emails are registered.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                Session:
                  value:
                    user:
                      id: 6f1b7c58-6d3a-4a5e-9e5e-9c0b1f2a3d4e
                      name: Raj Kumar
                      email: raj@streamsync.app
                      avatar_url: null
                      title: null
                      created_at: '2026-08-03T10:15:00Z'
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_at: '2026-08-03T10:30:00Z'
          description: Authenticated. The refresh token is set as an httpOnly cookie
            and is deliberately absent from this body.
        '400':
          description: Malformed request body.
        '401':
          description: Incorrect email or password.
        '429':
          description: Too many sign-in attempts.
  /api/auth/google/:
    post:
      operationId: auth_google
      description: Exchanges a verified Google ID token — the `credential` Google's
        Sign In With Google button hands the frontend — for a StreamSync session.
        The first sign-in for a given Google identity creates the account automatically;
        an existing password account sharing the same verified email is linked rather
        than duplicated.
      summary: Sign in with Google
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                Session:
                  value:
                    user:
                      id: 6f1b7c58-6d3a-4a5e-9e5e-9c0b1f2a3d4e
                      name: Raj Kumar
                      email: raj@streamsync.app
                      avatar_url: null
                      title: null
                      created_at: '2026-08-03T10:15:00Z'
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_at: '2026-08-03T10:30:00Z'
          description: Authenticated. The refresh token is set as an httpOnly cookie
            and is deliberately absent from this body.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                Session:
                  value:
                    user:
                      id: 6f1b7c58-6d3a-4a5e-9e5e-9c0b1f2a3d4e
                      name: Raj Kumar
                      email: raj@streamsync.app
                      avatar_url: null
                      title: null
                      created_at: '2026-08-03T10:15:00Z'
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_at: '2026-08-03T10:30:00Z'
          description: Authenticated. The refresh token is set as an httpOnly cookie
            and is deliberately absent from this body.
        '401':
          description: The Google credential could not be verified.
        '429':
          description: Too many attempts.
        '503':
          description: Google sign-in is not configured.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh
      description: Reads the refresh token from its httpOnly cookie, revokes it and
        issues a new pair. The request body is ignored. Returns the user as well as
        the access token so a page reload can restore the session in one round trip.
      summary: Refresh the session
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                Session:
                  value:
                    user:
                      id: 6f1b7c58-6d3a-4a5e-9e5e-9c0b1f2a3d4e
                      name: Raj Kumar
                      email: raj@streamsync.app
                      avatar_url: null
                      title: null
                      created_at: '2026-08-03T10:15:00Z'
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_at: '2026-08-03T10:30:00Z'
          description: Authenticated. The refresh token is set as an httpOnly cookie
            and is deliberately absent from this body.
        '401':
          description: Missing, expired or already-used refresh token.
  /api/auth/logout/:
    post:
      operationId: auth_logout
      description: 'Blacklists the refresh token and clears its cookie. Idempotent:
        returns 204 even when there was no session to end.'
      summary: Sign out
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Signed out.
  /api/auth/me/:
    get:
      operationId: auth_me
      description: |-
        The signed-in user.

        Uses the project-wide default permission (IsAuthenticated), so it is also
        the smallest possible check that JWT authentication is wired up correctly.
        Stated explicitly rather than inherited, because the security of this
        endpoint should be readable without opening the settings module.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: No or invalid access token.
  /api/workspaces/:
    get:
      operationId: workspaces_list
      description: Only workspaces where the caller holds an active membership. Pending
        invitations are not included — see `/api/workspaces/invitations/`.
      summary: List my workspaces
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaceList'
          description: ''
    post:
      operationId: workspaces_create
      description: The creator becomes its owner in the same transaction.
      summary: Create a workspace
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/workspaces/invitations/:
    get:
      operationId: workspaces_my_invitations
      description: 'Names the workspace and the inviter: this is what the recipient
        decides on, and it is not reachable from anywhere else — a workspace you have
        not joined is absent from GET /api/workspaces/.'
      summary: My pending invitations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPendingInvitationList'
          description: ''
  /api/workspaces/{workspace_id}/:
    get:
      operationId: workspaces_retrieve
      description: 404 for a workspace the caller is not a member of.
      summary: Workspace detail
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: Not found.
    patch:
      operationId: workspaces_update
      description: Owner only. The slug is fixed at creation and never changes.
      summary: Rename a workspace
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '403':
          description: Not the owner.
    delete:
      operationId: workspaces_destroy
      description: Owner only. Removes every membership with it.
      summary: Delete a workspace
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
  /api/workspaces/{workspace_id}/members/:
    get:
      operationId: workspaces_members_list
      description: Active members and pending invitations together, distinguished
        by `status`. Any member of the workspace may read this.
      summary: List members
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaceMemberList'
          description: ''
  /api/workspaces/{workspace_id}/members/{membership_id}/:
    patch:
      operationId: workspaces_member_update
      description: Owner only. The owner's own role cannot be changed here.
      summary: Change a member's role
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
    delete:
      operationId: workspaces_member_remove
      description: The owner may remove anyone; any member may remove themselves.
        The owner cannot be removed — transfer ownership first.
      summary: Remove a member or leave
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Removed.
  /api/workspaces/{workspace_id}/invitations/:
    post:
      operationId: workspaces_invite
      description: Owner only. Creates a membership in the `invited` state. The invitee
        must already have a StreamSync account — emailing a signup link needs the
        mail pipeline from Milestone 8.
      summary: Invite a member
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
        '400':
          description: Unknown email, or owner role requested.
        '403':
          description: Not the workspace owner.
        '409':
          description: Already a member or already invited.
  /api/workspaces/{workspace_id}/invitations/accept/:
    post:
      operationId: workspaces_invitation_accept
      description: |-
        Accept an invitation.

        Cannot use `visible_workspaces`, which by definition excludes workspaces
        the caller has not joined. The invitation itself is the authorization: the
        lookup is scoped to an INVITED membership belonging to the caller, so
        nobody can accept an invitation addressed to someone else.
      summary: Accept an invitation
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
        '400':
          description: No pending invitation.
        '404':
          description: No such workspace.
  /api/projects/:
    get:
      operationId: projects_list
      summary: List projects
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -due_date
          - -name
          - -updated_at
          - created_at
          - due_date
          - name
          - updated_at
        description: Sort field. Defaults to -updated_at.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Match name or description.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - completed
          - on_hold
          - planning
        description: Filter by lifecycle status.
      - in: query
        name: workspace
        schema:
          type: string
        description: Filter by workspace id.
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: projects_create
      description: Requires the editor or owner role in the target workspace.
      summary: Create a project
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '403':
          description: Viewers cannot create projects.
        '404':
          description: No such workspace for this caller.
  /api/projects/{project_id}/:
    get:
      operationId: projects_retrieve
      summary: Project detail
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '404':
          description: Not found.
    patch:
      operationId: projects_update
      description: Requires the editor or owner role. Viewers are read-only.
      summary: Update a project
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '403':
          description: Read-only role.
    delete:
      operationId: projects_destroy
      description: Workspace owner only. Documents filed under the project survive
        and become unfiled rather than being deleted with it.
      summary: Delete a project
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
  /api/documents/:
    get:
      operationId: documents_list
      description: Bodies are omitted; `excerpt` carries the preview.
      summary: List documents
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -title
          - -updated_at
          - created_at
          - title
          - updated_at
        description: Sort field. Defaults to -updated_at.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
        description: Filter by project id, or "none" for unfiled documents.
      - in: query
        name: search
        schema:
          type: string
        description: Match title or body.
      - in: query
        name: workspace
        schema:
          type: string
        description: Filter by workspace id.
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentSummaryList'
          description: ''
    post:
      operationId: documents_create
      description: Creates the document and its version 1 in one transaction. Requires
        the editor or owner role in the target workspace.
      summary: Create a document
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
          description: ''
        '400':
          description: Project belongs to another workspace.
        '403':
          description: Viewers cannot create documents.
        '404':
          description: No such workspace for this caller.
  /api/documents/{document_id}/:
    get:
      operationId: documents_retrieve
      description: Includes the body and the current revision number.
      summary: Document detail
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '404':
          description: Not found, or not the caller's workspace.
    patch:
      operationId: documents_update
      description: 'Requires the editor or owner role. Send `revision` to make the
        write conditional: a mismatch returns 409 instead of silently overwriting
        somebody else''s save.'
      summary: Edit a document
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '403':
          description: Viewers cannot edit.
        '409':
          description: The document changed while editing.
    delete:
      operationId: documents_destroy
      description: Requires the editor or owner role. Removes its versions with it.
      summary: Delete a document
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted.
  /api/documents/{document_id}/versions/:
    get:
      operationId: documents_versions_list
      description: Newest first. Snapshot bodies are omitted — restore reads the content
        server-side, so no client needs it.
      summary: List a document's versions
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentVersionList'
          description: ''
  /api/documents/{document_id}/versions/{version_id}/restore/:
    post:
      operationId: documents_version_restore
      description: |-
        Restoring version 5 creates version 6 containing version 5's content. Version 5 is never modified and versions 6..N are never removed — undoing a restore is just another restore.

        Requires the editor or owner role. Returns the updated document.
      summary: Restore a version
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '403':
          description: Viewers cannot restore.
        '404':
          description: No such document or version.
  /api/tasks/:
    get:
      operationId: tasks_list
      summary: List tasks
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: User id, "me" for your own, or "none" for unassigned.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -due_date
          - -priority
          - -title
          - -updated_at
          - created_at
          - due_date
          - priority
          - title
          - updated_at
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
          - urgent
      - in: query
        name: project
        schema:
          type: string
        description: Filter by project id.
      - in: query
        name: search
        schema:
          type: string
        description: Match title or description.
      - in: query
        name: status
        schema:
