components:
  schemas:
    ActionEnum:
      enum:
      - project_created
      - document_created
      - document_edited
      - task_created
      - task_completed
      - member_invited
      - comment_added
      - ai_action
      type: string
      description: |-
        * `project_created` - Project created
        * `document_created` - Document created
        * `document_edited` - Document edited
        * `task_created` - Task created
        * `task_completed` - Task completed
        * `member_invited` - Member invited
        * `comment_added` - Comment added
        * `ai_action` - AI action
    ActionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        assignee_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        assignee_name:
          type: string
          readOnly: true
          nullable: true
        assignee_source:
          allOf:
          - $ref: '#/components/schemas/AiAssigneeSource'
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        priority:
          allOf:
          - $ref: '#/components/schemas/TaskPriority'
          readOnly: true
        source_quote:
          type: string
          readOnly: true
        source_section:
          type: string
          readOnly: true
          nullable: true
      required:
      - assignee_id
      - assignee_name
      - assignee_source
      - due_date
      - id
      - priority
      - source_quote
      - source_section
      - title
    ActionItems:
      type: object
      description: |-
        Who produced this, and when.

        On every AI response. `engine` is the real identifier of whatever ran —
        a model id, or `mock-heuristic` when the deterministic fallback answered —
        because a UI that says "generated by AI" over rule-based string handling is
        a UI that has misled its user.
      properties:
        engine:
          type: string
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionItem'
          readOnly: true
      required:
      - engine
      - generated_at
      - items
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        actor:
          type: object
          additionalProperties: {}
          description: |-
            Never null, even after the account is gone.

            `actor` is SET_NULL so a departed account cannot pin the log in place,
            but the client types this as non-null. The name copied into metadata at
            write time is what makes the entry still readable — which is the whole
            reason it is copied.
          readOnly: true
        target:
          type: object
          additionalProperties: {}
          readOnly: true
        context:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - context
      - created_at
      - id
      - target
      - workspace_id
    AiAssigneeSource:
      enum:
      - named
      - suggested
      type: string
      description: |-
        * `named` - Named in the document
        * `suggested` - Suggested by the assistant
    AiRewriteMode:
      enum:
      - improve
      - shorten
      - expand
      - tone
      type: string
      description: |-
        * `improve` - Improve
        * `shorten` - Shorten
        * `expand` - Expand
        * `tone` - Adjust tone
    AiTone:
      enum:
      - professional
      - friendly
      - direct
      type: string
      description: |-
        * `professional` - Professional
        * `friendly` - Friendly
        * `direct` - Direct
    Answer:
      type: object
      description: |-
        Who produced this, and when.

        On every AI response. `engine` is the real identifier of whatever ran —
        a model id, or `mock-heuristic` when the deterministic fallback answered —
        because a UI that says "generated by AI" over rule-based string handling is
        a UI that has misled its user.
      properties:
        engine:
          type: string
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        answer:
          type: string
          readOnly: true
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          readOnly: true
        grounded:
          type: boolean
          readOnly: true
      required:
      - answer
      - citations
      - engine
      - generated_at
      - grounded
    AskRequest:
      type: object
      description: |-
        The body shared by summarize, action-items and ask.

        `workspace_id` is accepted because the client sends it, and checked against
        the document rather than trusted: the document's own workspace is what
        governs access, so a mismatched id is a bug worth rejecting loudly rather
        than a permission the caller can claim.

        `content` is the unsaved editor body. Optional — without it the stored copy
        is used — and capped, so the assistant cannot be used as a way to push
        arbitrary volumes of text through the server.
      properties:
        document_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
          nullable: true
          maxLength: 1000000
        question:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - document_id
      - question
    AssignableWorkspaceRole:
      enum:
      - editor
      - viewer
      type: string
      description: |-
        * `editor` - Editor
        * `viewer` - Viewer
    Citation:
      type: object
      properties:
        quote:
          type: string
          readOnly: true
        section:
          type: string
          readOnly: true
          nullable: true
      required:
      - quote
      - section
    Collaborator:
      type: object
      description: |-
        The minimal user shape used inside other resources.

        Avatar stacks, "last edited by" labels and member lists need a name and a
        picture, not an email address. Keeping this separate from UserSerializer
        means embedding a user somewhere new does not quietly widen how much
        personal data that endpoint discloses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Full name
          description: Display name shown to collaborators.
        avatar_url:
          type: string
          readOnly: true
      required:
      - avatar_url
      - id
      - name
    CollaboratorPresence:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CollaboratorPresenceStatusEnum'
          readOnly: true
        activity:
          type: string
          readOnly: true
          nullable: true
      required:
      - activity
      - status
      - user
    CollaboratorPresenceStatusEnum:
      enum:
      - online
      - idle
      - offline
      type: string
      description: |-
        * `online` - online
        * `idle` - idle
        * `offline` - offline
    Comment:
      type: object
      description: A thread root, with its replies.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        body:
          type: string
          readOnly: true
        mentions:
          readOnly: true
        quoted_text:
          type: string
          nullable: true
          readOnly: true
        resolved:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        replies:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Prefetched by the view, so this costs no query per thread.

            Falls back to the relation when the serializer is used outside that
            queryset — a correctness fallback, not the expected path.
          readOnly: true
      required:
      - author
      - body
      - created_at
      - edited_at
      - id
      - mentions
      - quoted_text
      - replies
      - resolved
      - resource_id
      - resource_type
    CommentCreateRequest:
      type: object
      description: |-
