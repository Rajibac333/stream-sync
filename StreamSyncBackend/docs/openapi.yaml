    DocumentDetail:
      type: object
      description: The full record, including the body the editor loads.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        project_name:
          type: string
          nullable: true
          readOnly: true
        title:
          type: string
          readOnly: true
        excerpt:
          type: string
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        last_edited_by:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        collaborators:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Everyone who has contributed to this document.

            Derived from the people on the record — its author, its last editor and
            the authors of its versions — rather than stored on a join table. There
            is no separate notion of "contributor" to maintain, and the set is
            exactly the union of those, so a table would be a second source of
            truth that could disagree.
          readOnly: true
        active_collaborator_ids:
          type: array
          items:
            type: string
          description: |-
            Who is in the document right now.

            Always empty in this milestone. Presence is delivered over the
            WebSocket, which does not exist until Milestone 7 — so nobody is
            connected, and an empty list is the truthful answer rather than a
            placeholder. (README §42)
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        content:
          type: string
          readOnly: true
        revision:
          type: integer
          readOnly: true
      required:
      - active_collaborator_ids
      - author
      - collaborators
      - content
      - created_at
      - excerpt
      - id
      - last_edited_by
      - project_id
      - project_name
      - revision
      - title
      - updated_at
      - workspace_id
    DocumentOperationRequest:
      type: object
      description: |-
        The body shared by summarize, action-items and ask.

        `workspace_id` is accepted because the client sends it, and checked against
        the document rather than trusted: the document's own workspace is what
        governs access, so a mismatched id is a bug worth rejecting loudly rather
        than a permission the caller can claim.

        `content` is the unsaved editor body. Optional — without it the stored copy
        is used — and capped, so the assistant cannot be used as a way to push
        arbitrary volumes of text through the server.
      properties:
        document_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
          nullable: true
