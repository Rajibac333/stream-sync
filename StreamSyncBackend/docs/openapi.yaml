        The author comes from the session. `mention_ids` are validated against
        workspace membership in the service — unknown ids are dropped rather than
        rejected, so a stale client cannot lose someone's comment.
      properties:
        resource_type:
          $ref: '#/components/schemas/CommentResource'
        resource_id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 5000
        mention_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        quoted_text:
          type: string
          nullable: true
          default: ''
          maxLength: 500
      required:
      - body
      - resource_id
      - resource_type
    CommentReplyCreateRequest:
      type: object
      description: Reply input. The resource is inherited from the thread, never sent.
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        mention_ids:
          type: array
          items:
