    DocumentVersion:
      type: object
      description: |-
        One entry in a document's history.

        The body is deliberately absent: a history list renders "Version 12 / Raj /
        10:42 AM / Added Apple Pay section", and shipping every snapshot's full
        text would make the list heavier than the document itself. Restore reads
        the content server-side, so no client ever needs it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/Collaborator'
          readOnly: true
        summary:
          type: string
          readOnly: true
          description: One line describing the change, e.g. "Added Apple Pay section".
        is_current:
          type: boolean
          description: |-
            Whether this is the version the editor is currently showing.

            Compared against a number the view supplies once for the whole page,
            rather than re-querying the maximum for every row.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - is_current
      - number
      - summary
    GoogleLoginRequest:
      type: object
      description: |-
        Google sign-in input.

        `credential` matches the field name Google's own Identity Services library
        hands the frontend's callback — keeping it means the client forwards the
        button's payload unchanged rather than renaming a key for no reason. It is
        the signed ID token JWT, verified server-side in `services.py`; nothing
        about it is trusted until that verification passes.
